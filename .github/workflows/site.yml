name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: enso
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: enso_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U enso" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: site
    env:
      TEST_DATABASE_URL: postgres://enso@localhost:5432/enso_test
      DATABASE_URL: postgres://enso@localhost:5432/enso_test
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Installer syntax
        run: bash -n static/install.sh
