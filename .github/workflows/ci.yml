name: CI

on:
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/site.yml']

permissions:
  contents: read

jobs:
  check:
    # macOS: the full set (lint, AMO metadata, tarball), and the Keychain tests
    # use the runner's login keychain. Linux and Windows: the helper-tests job.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helper/package-lock.json

      - name: Syntax-check every module
        run: |
          status=0
          for f in $(git ls-files '*.mjs' '*.js' ':!site'); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; status=1; }
          done
          bash -n scripts/install.sh scripts/dev.sh scripts/pack-helper.sh || status=1
          exit $status

      - name: Check the manifest
        run: |
          node -e '
            const m = require("./extension/manifest.json");
            const id = m.browser_specific_settings?.gecko?.id;
            if (id !== "enso@wicker.life") { console.error(`::error::extension id is ${id}, expected enso@wicker.life`); process.exit(1); }
            const pkg = require("./helper/package.json");
            if (pkg.version !== m.version) { console.error(`::error::helper/package.json ${pkg.version} != manifest ${m.version}`); process.exit(1); }
            console.log(`Ensō ${m.version} (${id})`);
          '

      - name: Check the AMO listing and submission metadata
        run: |
          node amo/amo.mjs listing --dry-run > /dev/null
          node amo/amo.mjs metadata "$(node -p 'require("./extension/manifest.json").version')" "$RUNNER_TEMP/amo-metadata.json"

      - name: Lint the extension
        run: npx --yes web-ext@8 lint --source-dir extension

      - name: Install helper dependencies
        working-directory: helper
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Helper tests
        working-directory: helper
        run: npm test

      - name: Helper tarball size
        run: |
          scripts/pack-helper.sh "$(node -p 'require("./helper/package.json").version')" dist
          size=$(stat -f %z dist/enso-helper-*.tar.gz)
          echo "Helper tarball: $((size / 1024 / 1024)) MB"
          [ "$size" -lt $((40 * 1024 * 1024)) ] || { echo "::error::helper tarball is over 40 MB"; exit 1; }

  helper-tests:
    # The helper on Linux and Windows (x64 and arm64). Secrets go to the real
    # store: a throwaway GNOME Keyring on Linux (libsecret through secret-tool),
    # the runner's Credential Manager on Windows; test items are removed again.
    name: helper tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helper/package-lock.json

      - name: Install helper dependencies
        working-directory: helper
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Keyring for libsecret (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus

      - name: Helper tests (Linux, with a throwaway keyring)
        if: runner.os == 'Linux'
        working-directory: helper
        env:
          ENSO_TEST_REAL_SECRETS: '1'
        run: |
          dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; sleep 1; npm test'

      - name: Helper tests (Windows, Credential Manager)
        if: runner.os == 'Windows'
        working-directory: helper
        env:
          ENSO_TEST_REAL_SECRETS: '1'
        run: npm test

      - name: Installer end to end (Linux)
        # install.sh in a throwaway HOME with the real helper tarball, then `enso
        # doctor` starts the installed run.sh the way Zen does and needs its
        # answer to hello. Also Ensō's own Node, checked against the pinned hash.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          scripts/pack-helper.sh 0.0.0-ci "$RUNNER_TEMP/dist"
          a=x64; [ "$(uname -m)" = aarch64 ] && a=arm64
          curl -fsSL -o "$RUNNER_TEMP/node.tar.xz" "https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-$a.tar.xz"
          (cd helper && ENSO_TEST_PRIVATE_NODE=1 ENSO_TEST_NODE_TARBALL="$RUNNER_TEMP/node.tar.xz" node test/install.test.mjs)
          H="$(mktemp -d)"
          HOME="$H" ENSO_HELPER_URL="file://$RUNNER_TEMP/dist/enso-helper-0.0.0-ci.tar.gz" ENSO_NO_OPEN=1 ENSO_NODE=system bash scripts/install.sh
          HOME="$H" "$H/.local/bin/enso" doctor | tee "$RUNNER_TEMP/doctor.txt" || true
          grep -q "✓ Helper .*answered hello" "$RUNNER_TEMP/doctor.txt"
          grep -q "✓ Zen/Firefox manifest" "$RUNNER_TEMP/doctor.txt"
          rm -rf "$H"
