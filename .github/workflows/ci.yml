name: CI

on:
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/site.yml']

permissions:
  contents: read

jobs:
  check:
    # macOS: the full set (lint, AMO metadata, tarball), and the Keychain tests
    # use the runner's login keychain. Linux and Windows: the helper-tests job.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helper/package-lock.json

      - name: Syntax-check every module
        run: |
          status=0
          for f in $(git ls-files '*.mjs' '*.js' ':!site'); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; status=1; }
          done
          bash -n scripts/install.sh scripts/dev.sh scripts/pack-helper.sh || status=1
          exit $status

      - name: Check the manifest
        run: |
          node -e '
            const m = require("./extension/manifest.json");
            const id = m.browser_specific_settings?.gecko?.id;
            if (id !== "enso@wicker.life") { console.error(`::error::extension id is ${id}, expected enso@wicker.life`); process.exit(1); }
            const pkg = require("./helper/package.json");
            if (pkg.version !== m.version) { console.error(`::error::helper/package.json ${pkg.version} != manifest ${m.version}`); process.exit(1); }
            console.log(`Ensō ${m.version} (${id})`);
          '

      - name: Check the AMO listing and submission metadata
        run: |
          node amo/amo.mjs listing --dry-run > /dev/null
          node amo/amo.mjs metadata "$(node -p 'require("./extension/manifest.json").version')" "$RUNNER_TEMP/amo-metadata.json"

      - name: Lint the extension
        run: npx --yes web-ext@8 lint --source-dir extension

      - name: Build and lint the listed (AMO) extension
        # The build submitted to addons.mozilla.org: page_eval stripped, and the
        # script fails if eval( or new Function is left (scripts/build-extension.mjs).
        run: |
          node scripts/build-extension.mjs --channel listed --out "$RUNNER_TEMP/listed"
          npx --yes web-ext@8 lint --source-dir "$RUNNER_TEMP/listed"

      - name: Install helper dependencies
        working-directory: helper
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Helper tests
        working-directory: helper
        run: npm test

      - name: Helper tarball size
        run: |
          scripts/pack-helper.sh "$(node -p 'require("./helper/package.json").version')" dist
          size=$(stat -f %z dist/enso-helper-*.tar.gz)
          echo "Helper tarball: $((size / 1024 / 1024)) MB"
          [ "$size" -lt $((40 * 1024 * 1024)) ] || { echo "::error::helper tarball is over 40 MB"; exit 1; }

  helper-tests:
    # The helper on Linux and Windows (x64 and arm64). Secrets go to the real
    # store: a throwaway GNOME Keyring on Linux (libsecret through secret-tool),
    # the runner's Credential Manager on Windows; test items are removed again.
    name: helper tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helper/package-lock.json

      - name: Install helper dependencies
        working-directory: helper
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Keyring for libsecret (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus

      - name: Helper tests (Linux, with a throwaway keyring)
        if: runner.os == 'Linux'
        working-directory: helper
        env:
          ENSO_TEST_REAL_SECRETS: '1'
        run: |
          dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; sleep 1; npm test'

      - name: Helper tests (Windows, Credential Manager)
        if: runner.os == 'Windows'
        working-directory: helper
        env:
          ENSO_TEST_REAL_SECRETS: '1'
        run: npm test

      - name: Installer end to end (Linux)
        # install.sh in a throwaway HOME with the real helper tarball, then `enso
        # doctor` starts the installed run.sh the way Zen does and needs its
        # answer to hello. Also Ensō's own Node, checked against the pinned hash.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          scripts/pack-helper.sh 0.0.0-ci "$RUNNER_TEMP/dist"
          a=x64; [ "$(uname -m)" = aarch64 ] && a=arm64
          curl -fsSL -o "$RUNNER_TEMP/node.tar.xz" "https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-$a.tar.xz"
          (cd helper && ENSO_TEST_PRIVATE_NODE=1 ENSO_TEST_NODE_TARBALL="$RUNNER_TEMP/node.tar.xz" node test/install.test.mjs)
          H="$(mktemp -d)"
          HOME="$H" ENSO_HELPER_URL="file://$RUNNER_TEMP/dist/enso-helper-0.0.0-ci.tar.gz" ENSO_NO_OPEN=1 ENSO_NODE=system bash scripts/install.sh
          HOME="$H" "$H/.local/bin/enso" doctor | tee "$RUNNER_TEMP/doctor.txt" || true
          grep -q "✓ Helper .*answered hello" "$RUNNER_TEMP/doctor.txt"
          grep -q "✓ Zen/Firefox manifest" "$RUNNER_TEMP/doctor.txt"
          rm -rf "$H"

  windows-install:
    # install.ps1 in a temporary profile (USERPROFILE, APPDATA, LOCALAPPDATA in
    # RUNNER_TEMP) with this checkout's helper: a fresh install with Enso's own
    # Node (downloaded and checked against the pinned hash), `enso doctor`
    # (registry key, manifest, run.cmd answering hello), a second run (same
    # result), and a run while a helper started through run.cmd is running.
    name: install.ps1 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Helper tarball from this checkout
        shell: pwsh
        run: |
          Push-Location helper
          npm ci --omit=dev --omit=optional --no-audit --no-fund
          Set-Content -Path VERSION -Value '0.0.0-ci' -Encoding Ascii
          Pop-Location
          & "$env:SystemRoot\System32\tar.exe" -czf "$env:RUNNER_TEMP\helper.tar.gz" --exclude=helper/test -C . helper
          Get-Item "$env:RUNNER_TEMP\helper.tar.gz" | Select-Object Name, Length

      - name: Install, check, reinstall, update while running
        shell: powershell # Windows PowerShell 5.1, what `irm | iex` runs in for most people
        run: |
          $ErrorActionPreference = 'Stop'
          $profileDir = Join-Path $env:RUNNER_TEMP 'Enso Test User'
          $env:USERPROFILE = $profileDir
          $env:APPDATA = Join-Path $profileDir 'AppData\Roaming'
          $env:LOCALAPPDATA = Join-Path $profileDir 'AppData\Local'
          New-Item -ItemType Directory -Force -Path $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          $env:ENSO_HELPER_URL = 'file:///' + ("$env:RUNNER_TEMP\helper.tar.gz" -replace '\\', '/')
          $env:ENSO_NO_OPEN = '1'
          $env:ENSO_NODE = 'private'
          $script = Get-Content -Raw site/static/install.ps1

          Invoke-Expression $script
          $app = Join-Path $env:APPDATA 'Enso'
          $node = (Get-Content (Join-Path $app 'install.json') | ConvertFrom-Json).node
          if ($node.source -ne 'private' -or -not (Test-Path $node.path)) { throw "private Node missing: $($node | ConvertTo-Json)" }
          $reg = (Get-Item 'HKCU:\Software\Mozilla\NativeMessagingHosts\enso').GetValue('')
          if ($reg -ne (Join-Path $app 'enso.json')) { throw "registry points at $reg" }
          if (([Environment]::GetEnvironmentVariable('Path', 'User')).Split(';') -notcontains (Join-Path $app 'bin')) { throw 'bin not on the user PATH' }

          $doctor = & (Join-Path $app 'bin\enso.cmd') doctor | Out-String
          Write-Host $doctor
          if ($doctor -notmatch 'Registry key' -or $doctor -notmatch [regex]::Escape('started and answered hello')) { throw 'enso doctor did not get a hello through run.cmd' }

          $before = (Get-ChildItem -Recurse $app | ForEach-Object { $_.FullName.Substring($app.Length) } | Sort-Object) -join "`n"
          Invoke-Expression $script
          $after = (Get-ChildItem -Recurse $app | ForEach-Object { $_.FullName.Substring($app.Length) } | Sort-Object) -join "`n"
          if ($before -ne $after) { throw "second run changed the files:`n$(Compare-Object ($before -split "`n") ($after -split "`n") | Out-String)" }
          Write-Host 'ok - second run leaves the same files'

          # A helper running from the installed folder (stdin kept open), then update.
          $psi = New-Object Diagnostics.ProcessStartInfo
          $psi.FileName = (Join-Path $app 'bin\run.cmd'); $psi.Arguments = "`"$(Join-Path $app 'enso.json')`" enso@wicker.life"
          $psi.UseShellExecute = $false; $psi.RedirectStandardInput = $true; $psi.RedirectStandardOutput = $true
          $psi.EnvironmentVariables['ENSO_MCP_PORT'] = '48777'
          $p = [Diagnostics.Process]::Start($psi)
          Start-Sleep -Seconds 3
          Invoke-Expression $script
          if (-not (Test-Path (Join-Path $app 'helper\host.mjs'))) { throw 'helper missing after an update while running' }
          Write-Host 'ok - update while the helper runs'
          $p.StandardInput.Close(); if (-not $p.WaitForExit(10000)) { $p.Kill() }
          Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Enso\Logs') | Select-Object Name, Length
