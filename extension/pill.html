<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open Ensō</title>
  <!-- Laid transparently over the page pill by pageagent.js. A click here is a
       click in an extension page, so sidebarAction.open() is allowed. -->
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    button { all: unset; display: block; width: 100%; height: 100%; cursor: pointer; border-radius: 999px; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: -3px; }
  </style>
  <script src="pill.js" defer></script>
</head>
<body>
  <button type="button" aria-label="Open Ensō's sidebar to see what the agent is doing, pause or stop it"></button>
</body>
</html>
